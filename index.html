<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест soft skills для найма</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f2328;--mu:#6b7280;--ac:#2f6f5e;--ac2:#e8f1ee;--bd:#e3e1da;--bad:#b5533c;--bad2:#f8ebe7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191a;--card:#212426;--tx:#ececec;--mu:#9aa0a6;--ac:#5fb59f;--ac2:#23352f;--bd:#33373a;--bad:#e08a73;--bad2:#3a2923}}
:root[data-theme="dark"]{--bg:#17191a;--card:#212426;--tx:#ececec;--mu:#9aa0a6;--ac:#5fb59f;--ac2:#23352f;--bd:#33373a;--bad:#e08a73;--bad2:#3a2923}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px}
h1{font-size:26px;margin:0 0 8px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:16px 0 6px}
p{margin:0 0 10px}.mu{color:var(--mu);font-size:14px}
input[type=text]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;margin:8px 0 14px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}.btn.sec{background:var(--ac2);color:var(--ac)}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-bottom:16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.opt.m{border-color:var(--ac);background:var(--ac2)}.opt.l{border-color:var(--bad);background:var(--bad2)}
.opt span{flex:1}
.tg{display:flex;gap:6px}
.tg button{width:40px;height:40px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px}
.tg button.on.p{background:var(--ac);color:#fff;border-color:var(--ac)}.tg button.on.n{background:var(--bad);color:#fff;border-color:var(--bad)}
.leg{display:flex;gap:16px;font-size:13px;color:var(--mu);margin-bottom:12px}
.row{margin-bottom:12px}.row b{display:flex;justify-content:space-between;font-size:15px}
.t{height:12px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:4px}.t i{display:block;height:100%;border-radius:6px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;margin:0 6px 6px 0;background:var(--ac2);color:var(--ac)}
.tag.w2{background:var(--bad2);color:var(--bad)}
ul{margin:4px 0 10px;padding-left:20px}li{margin-bottom:4px}
.nav{display:flex;justify-content:space-between;gap:10px}
@media print{.noprint{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
const C={
com:{n:"Коммуникация",d:"ясно доносит мысли, задаёт вопросы, умеет слушать",q:["Расскажите о случае, когда вас неправильно поняли. Что вы сделали?","Как вы объясняли сложную тему человеку без экспертизы?"]},
team:{n:"Командная работа",d:"сотрудничает, делится знаниями, ставит общий результат выше личного",q:["Опишите проект, где успех зависел от других. Какой был ваш вклад?","Когда вы последний раз помогали коллеге в ущерб своим задачам?"]},
lead:{n:"Лидерство и инициатива",d:"берёт на себя координацию, предлагает решения, ведёт за собой",q:["Расскажите, когда вы взяли инициативу без формального поручения.","Как вы убеждали команду принять непопулярное решение?"]},
resp:{n:"Ответственность",d:"держит обещания, доводит до результата, признаёт ошибки",q:["Расскажите о сорванном дедлайне: причины и ваши действия.","Какую свою ошибку вы признали первым и чем это закончилось?"]},
adapt:{n:"Адаптивность",d:"спокойно переживает изменения и неопределённость",q:["Опишите резкое изменение условий на работе. Как вы отреагировали?","Какой навык вам пришлось быстро сменить или освоить заново?"]},
eq:{n:"Эмоциональный интеллект",d:"считывает состояние людей, управляет своими реакциями, конструктивен в конфликте",q:["Расскажите о конфликте с коллегой и как вы его разрешили.","Как вы реагируете, когда вас критикуют несправедливо?"]},
prob:{n:"Решение проблем",d:"структурирует хаос, ищет причины, оценивает риски",q:["Разберите сложную проблему, которую вы решили. С чего начали?","Как вы принимаете решения при нехватке данных?"]},
grow:{n:"Саморазвитие",d:"учится, ищет обратную связь, делает выводы",q:["Чему вы научились за последние полгода и как именно?","Какую обратную связь вы получали и что с ней сделали?"]}
};
const Q=[
["Вам поручили проект с нечёткими целями. Что вы сделаете первым?",[["com","Задам заказчику уточняющие вопросы, пока цель не станет ясной"],["lead","Предложу план и распределю роли, не дожидаясь идеальной ясности"],["prob","Разложу задачу на части и найду самое рискованное место"],["grow","Изучу, как подобные проекты делали другие"]]],
["Коллега постоянно срывает сроки, и это мешает вашей работе.",[["eq","Спокойно поговорю лично и узнаю причины"],["resp","Предложу чёткие договорённости и буду отслеживать сроки"],["team","Предложу помощь, чтобы мы уложились вместе"],["adapt","Перестрою свою работу, чтобы меньше зависеть от него"]]],
["Приоритеты резко поменялись, и неделя вашей работы потеряла смысл.",[["adapt","Быстро переключусь, старое не жалко"],["resp","Выясню, что из сделанного ещё можно довести до результата"],["eq","Сначала переживу досаду, потом буду действовать"],["grow","Попрошу объяснить логику, чтобы лучше понимать будущие приоритеты"]]],
["Вы допустили ошибку, о которой пока никто не знает.",[["resp","Сразу сообщу и возьму исправление на себя"],["com","Подготовлю чёткое описание: что случилось, что затронуто, что делать"],["prob","Сначала оценю масштаб и найду способ исправить, потом сообщу"],["grow","Разберу причину, чтобы такое не повторилось"]]],
["В команде конфликт двух сильных сотрудников.",[["eq","Поговорю с каждым отдельно, пойму эмоции и интересы"],["lead","Соберу обоих и помогу договориться о правилах"],["team","Постараюсь не принимать сторону и сохранить рабочую атмосферу"],["com","Предложу высказаться по очереди и зафиксирую договорённости"]]],
["Нужно освоить незнакомый инструмент за несколько дней.",[["grow","Составлю план обучения и буду практиковаться каждый день"],["prob","Найду минимальный набор функций, нужный для задачи"],["team","Спрошу тех, кто уже умеет, и попрошу показать"],["adapt","Начну делать сразу и разберусь по ходу"]]],
["Руководитель критикует вашу работу при всех.",[["eq","Сохраню спокойствие и отвечу по существу"],["grow","Выделю полезное и использую для улучшения"],["com","Позже попрошу уточнить детали один на один"],["resp","Признаю недочёты и озвучу план исправления"]]],
["Дедлайн горит, ресурсов не хватает.",[["lead","Соберу команду, определю главное и распределю задачи"],["prob","Оценю, чем можно пожертвовать без потери ценности"],["resp","Задержусь и сделаю критичное сам"],["com","Честно сообщу заинтересованным лицам о рисках и вариантах"]]],
["В команде появился новый человек, который пока не вписывается.",[["team","Включу его в общие задачи и обсуждения"],["eq","Присмотрюсь, что его смущает, и поддержу"],["lead","Предложу руководителю план адаптации и стану наставником"],["adapt","Подстрою свой стиль общения, чтобы нам было легче работать"]]],
["Вы не согласны с решением руководителя.",[["com","Аргументированно выскажу позицию на встрече"],["resp","Выполню, но зафиксирую риски"],["adapt","Приму решение и постараюсь сделать его рабочим"],["prob","Подготовлю альтернативу с данными и предложу сравнить"]]],
["Долгая рутинная работа, мотивация падает.",[["resp","Дисциплинированно доделаю, это моя задача"],["grow","Найду в рутине возможность чему-то научиться"],["eq","Замечу своё состояние и устрою паузу"],["team","Поговорю с командой и найду способ разделить нагрузку"]]],
["Проект завершён успешно. Что для вас важнее всего в итогах?",[["team","Как мы сработались"],["grow","Чему я научился"],["lead","Что мы смогли выстроить и вести за собой"],["prob","Какие сложные задачи удалось решить"]]]
];
const A={};let step=-1,name="",pos="";
const $=s=>document.getElementById(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function start(){return `<div class="card"><h1>Тест soft skills</h1><p class="mu">12 рабочих ситуаций, около 10 минут. В каждой выберите вариант, который <b>больше всего</b> про вас (＋), и вариант, который <b>меньше всего</b> про вас (−). Правильных ответов нет: важно, как вы действуете на самом деле.</p>
<input type="text" id="nm" placeholder="Имя кандидата" value="${esc(name)}"><input type="text" id="ps" placeholder="Должность (необязательно)" value="${esc(pos)}">
<button class="btn" onclick="go()">Начать</button></div>`}
function go(){name=$("nm").value.trim()||"Кандидат";pos=$("ps").value.trim();step=0;render()}
function qv(){const [t,o]=Q[step];const a=A[step]||{};
return `<div class="bar"><i style="width:${step/Q.length*100}%"></i></div><div class="card"><div class="mu">Ситуация ${step+1} из ${Q.length}</div><h2>${esc(t)}</h2>
<div class="leg"><span>＋ больше всего про меня</span><span>− меньше всего</span></div>
${o.map(([k,x],i)=>`<div class="opt ${a.m===i?'m':a.l===i?'l':''}"><span>${esc(x)}</span><div class="tg"><button class="p ${a.m===i?'on':''}" onclick="pick('m',${i})">＋</button><button class="n ${a.l===i?'on':''}" onclick="pick('l',${i})">−</button></div></div>`).join("")}
<div class="nav" style="margin-top:14px"><button class="btn sec" onclick="back()" ${step?'':'disabled'}>Назад</button><button class="btn" onclick="next()" ${(a.m!=null&&a.l!=null)?'':'disabled'}>${step==Q.length-1?'Показать результат':'Далее'}</button></div></div>`}
function pick(t,i){const a=A[step]=A[step]||{};const other=t=='m'?'l':'m';if(a[other]===i)a[other]=null;a[t]=a[t]===i?null:i;render()}
function next(){step++;render();scrollTo(0,0)}function back(){step--;render()}
function calc(){const s={},n={};Object.keys(C).forEach(k=>{s[k]=0;n[k]=0});
Q.forEach(([t,o],qi)=>{o.forEach(([k],i)=>{n[k]++;if(A[qi].m===i)s[k]++;if(A[qi].l===i)s[k]--})});
return Object.keys(C).map(k=>({k,p:Math.round((s[k]+n[k])/(2*n[k])*100),s:s[k]})).sort((a,b)=>b.p-a.p)}
function col(p){return p>=70?"var(--ac)":p>=40?"#c9a227":"var(--bad)"}
function result(){const r=calc();const top=r.slice(0,3),low=r.slice(-3).reverse();
return `<div class="card"><h1>${esc(name)}</h1><p class="mu">${esc(pos)}${pos?" · ":""}Профиль soft skills</p>
${r.map(x=>`<div class="row"><b><span>${C[x.k].n}</span><span>${x.p}%</span></b><div class="t"><i style="width:${x.p}%;background:${col(x.p)}"></i></div></div>`).join("")}
<p class="mu">Шкала показывает приоритет внутри профиля кандидата, а не сравнение с нормой. Тест выбора «больше/меньше всего про меня» выявляет, какие качества для человека типичны, а какие нет.</p></div>
<div class="card"><h2>Сильные стороны</h2>${top.map(x=>`<span class="tag">${C[x.k].n}</span>`).join("")}
<ul>${top.map(x=>`<li><b>${C[x.k].n}</b>: ${C[x.k].d}</li>`).join("")}</ul>
<h2 style="margin-top:20px">Зоны роста и риски</h2>${low.map(x=>`<span class="tag w2">${C[x.k].n}</span>`).join("")}
<ul>${low.map(x=>`<li><b>${C[x.k].n}</b>: нетипично для кандидата, стоит проверить на интервью</li>`).join("")}</ul></div>
<div class="card"><h2>Вопросы для интервью</h2><p class="mu">Проверьте слабые зоны поведенческими вопросами (по методу STAR: ситуация, задача, действие, результат).</p>
${low.map(x=>`<h3>${C[x.k].n}</h3><ul>${C[x.k].q.map(q=>`<li>${q}</li>`).join("")}</ul>`).join("")}
<h3>Подтвердите сильные стороны</h3><ul>${top.slice(0,2).map(x=>`<li>${C[x.k].n}: ${C[x.k].q[0]}</li>`).join("")}</ul></div>
<div class="card"><h2>Как использовать результат</h2><ul><li>Сопоставьте профиль с требованиями роли: для руководителя критичны лидерство и эмоциональный интеллект, для исполнителя — ответственность и саморазвитие.</li><li>Низкий балл — не приговор, а повод для вопросов. Высокий балл тоже стоит подтверждать примерами.</li><li>Тест основан на самооценке, поэтому используйте его вместе с интервью и рекомендациями, а не как единственный критерий.</li></ul>
<div class="nav noprint"><button class="btn sec" onclick="copyR()">Скопировать отчёт</button><button class="btn sec" onclick="print()">Печать</button><button class="btn" onclick="reset()">Новый кандидат</button></div><p class="mu" id="cp"></p></div>`}
function copyR(){const r=calc();const t=`Soft skills: ${name}${pos?" ("+pos+")":""}\n`+r.map(x=>`${C[x.k].n}: ${x.p}%`).join("\n")+`\nСильные: ${r.slice(0,3).map(x=>C[x.k].n).join(", ")}\nЗоны роста: ${r.slice(-3).map(x=>C[x.k].n).join(", ")}`;
try{navigator.clipboard.writeText(t).then(()=>$("cp").textContent="Скопировано",()=>$("cp").textContent=t)}catch(e){$("cp").textContent=t}}
function reset(){for(const k in A)delete A[k];name="";pos="";step=-1;render();scrollTo(0,0)}
function render(){$("app").innerHTML=step<0?start():step<Q.length?qv():result()}
render();
</script>
</body>
</html>
